name: Deploy to VPS (AWS EC2)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar clave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Agregar host a known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sincronizar backend con el VPS
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            ./backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/todo-app/backend/

      - name: Sincronizar frontend con el VPS
        run: |
          rsync -avz --delete \
            ./frontend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/todo-app/frontend/

      - name: Instalar dependencias y reiniciar la API
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
