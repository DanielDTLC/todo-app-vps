name: Deploy to VPS (AWS EC2)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar clave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Agregar host a known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sincronizar backend con el VPS
        run: rsync -avz --delete --exclude 'node_modules' --exclude '.env' ./backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/todo-app/backend/

      - name: Sincronizar frontend con el VPS
        run: rsync -avz --delete ./frontend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/todo-app/frontend/

      - name: Instalar dependencias
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/todo-app/backend && npm install --omit=dev"

      - name: Reiniciar la API con PM2
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/todo-app/backend && pm2 restart todo-api || pm2 start server.js --name todo-api"

      - name: Guardar estado de PM2
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "pm2 save"

      - name: Corregir permisos
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo chmod -R 755 /var/www/todo-app"

      - name: Verificar salud de la API
        run: |
          sleep 3
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "curl -f http://localhost:3000/api/health"